name: Deploy Mia Scarpa to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-miascarpa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/miascarpashoes.tn

            git fetch --all
            git reset --hard origin/main

            # Builds the new image while the old container keeps serving,
            # then swaps containers (only a few seconds of restart).
            docker compose -f compose.prod.yaml up -d --build --remove-orphans

            docker image prune -f

            # Health check: fail the workflow if the site doesn't answer
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8085/ || true)
              if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
                echo "Site is up (HTTP $code)"; exit 0
              fi
              sleep 3
            done
            echo "Site did not come up"; docker logs miascarpa-web --tail 100; exit 1
